name: CI/CD

on:
  push:
    branches: [main, develop, integration]
  pull_request:
    branches: [main, integration]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Lint & Format Check ────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint Backend
        working-directory: Backend
        run: |
          npm ci
          npm run lint

      - name: Lint Frontend
        working-directory: Frontend
        run: |
          npm ci --legacy-peer-deps
          npx eslint .

  # ─── Backend Tests ──────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/chopnow-test
      JWT_SECRET: test-jwt-secret-for-ci-only-not-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --forceExit

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: Backend/coverage/
          retention-days: 7

  # ─── Frontend Build ─────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: Frontend
    env:
      VITE_API_URL: https://api.chopnow.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Frontend/dist/
          retention-days: 7

  # ─── Docker Build (on main only) ───────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker image
        working-directory: Backend
        run: docker build -t chopnow-backend:${{ github.sha }} .

      - name: Build Frontend Docker image
        working-directory: Frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.chopnow.app' }} \
            -t chopnow-frontend:${{ github.sha }} .

  # ─── Security Audit ────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Backend
        working-directory: Backend
        run: npm audit --audit-level=high || true

      - name: Audit Frontend
        working-directory: Frontend
        run: npm audit --audit-level=high || true
