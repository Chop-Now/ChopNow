name: Keep API Awake

# Render's free plan puts the backend to sleep after ~15 minutes without traffic, and the
# first visitor after that waits about a minute. This pings it so that doesn't happen.
# It becomes unnecessary (and can be deleted) once the backend runs on a paid Render plan.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping /ready
        run: curl --silent --show-error --max-time 90 --retry 2 --retry-delay 10 https://chopnow-backend.onrender.com/ready
