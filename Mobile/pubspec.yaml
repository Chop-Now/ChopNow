name: chopnow
description: ChopNow — Rescue food, save money, sustain tomorrow.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # HTTP & networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.4.0

  # Secure storage (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Firebase (push notifications)
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4

  # Real-time (Socket.io)
  socket_io_client: ^2.0.3+1

  # Maps & Location
  google_maps_flutter: ^2.6.1
  geolocator: ^11.1.0
  geocoding: ^2.1.1

  # Camera & image
  camera: ^0.10.5+9
  image_picker: ^1.1.0

  # Image display
  cached_network_image: ^3.3.1

  # Local notifications
  flutter_local_notifications: ^17.2.2

  # Charts
  fl_chart: ^0.69.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: 5.1.1

  # Animations
  lottie: ^3.1.2
  shimmer: ^3.0.0
  animate_do: ^3.3.4

  # UI utilities
  smooth_page_indicator: ^1.2.0
  flutter_svg: ^2.0.10
  gap: ^3.0.1
  intl: ^0.19.0

  # Sharing
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  logger: ^2.4.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: 2.4.9
  riverpod_generator: ^2.3.0
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  custom_lint: ^0.5.0
  riverpod_lint: ^2.3.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
