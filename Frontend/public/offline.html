<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F3D2E" />
    <title>You're offline | ChopNow</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf3e4;
        color: #17150f;
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 24px;
        color: #4f625a;
        line-height: 1.5;
      }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #0f3d2e;
        color: #faf3e4;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        ChopNow needs a connection to show live deals and orders. Check your network and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
