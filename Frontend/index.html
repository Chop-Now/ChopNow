<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ChopNow - Rescue Delicious Food at Great Prices</title>
    <meta
      name="description"
      content="ChopNow connects you with local restaurants and stores to rescue surplus food at discounted prices. Save money, reduce waste, and enjoy delicious meals near you."
    />
    <meta name="theme-color" content="#0F3D2E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ChopNow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon. The mark is a single colour, so neither variant reads on both
         tab-bar themes: green disappears on dark, yellow washes out on light.
         Browsers pick by theme; ones that ignore `media` fall back to green. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logomarkyellow.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/logomarkgreen.svg" />
    <!-- iOS ignores SVG here and renders transparency as black, so this one is
         a flattened 180x180 PNG tile. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.chopnow.app/" />
    <meta property="og:title" content="ChopNow - Rescue Delicious Food at Great Prices" />
    <meta
      property="og:description"
      content="Save money and reduce food waste. ChopNow connects you with local businesses offering surplus food at amazing discounts."
    />
    <!-- 1200x630 branded link-preview image (see public/og-image.png). -->
    <meta property="og:image" content="https://www.chopnow.app/og-image.png" />
    <meta property="og:site_name" content="ChopNow" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.chopnow.app/" />
    <meta name="twitter:title" content="ChopNow - Rescue Delicious Food at Great Prices" />
    <meta
      name="twitter:description"
      content="Save money and reduce food waste. ChopNow connects you with local businesses offering surplus food at amazing discounts."
    />
    <meta name="twitter:image" content="https://www.chopnow.app/og-image.png" />

    <!-- Additional SEO -->
    <!-- robots + canonical are set per page by Components/RouteMeta.jsx -->

    <!-- Structured data: tells Google unambiguously what this site is and
         how its main sections relate, which is an input into (not a
         guarantee of) things like sitelinks in search results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ChopNow",
        "url": "https://www.chopnow.app/",
        "logo": "https://www.chopnow.app/apple-touch-icon.png",
        "email": "chopnow.app@gmail.com",
        "description": "ChopNow connects you with local restaurants and stores to rescue surplus food at discounted prices."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ChopNow",
        "url": "https://www.chopnow.app/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
